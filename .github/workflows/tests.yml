name: Python tests
on:
  push:
    branches:
      - "codex/**"
      - "fix/**"
  pull_request:
    branches: [main]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install pytest
      - run: python -m pip check
      - run: python -m py_compile server.py gunicorn.conf.py services/pg_store.py services/trade_database.py services/market_data.py services/dip_breakout_engine.py services/warrant_engine.py services/warrant_math.py services/market_breadth.py services/simulation_engine.py v8_engine/database.py v8_engine/regime.py v8_engine/breakout.py v8_engine/learning.py v8_engine/varrant.py v8_engine/entry_approval.py learning/learning_engine.py execution/risk_manager.py engines/backtest_engine.py
      - run: python -m pytest -q tests/
