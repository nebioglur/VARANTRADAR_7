name: BIST Cloud Market Sync & Auto Ping

on:
  schedule:
    # Pazartesi - Cuma: 
    # Sabah 09:45 TR (06:45 UTC) - Sabah seansı kesintisiz döngü
    - cron: '45 6 * * 1-5'
    # Öğleden sonra 13:45 TR (10:45 UTC) - Öğleden sonra seansı kesintisiz döngü
    - cron: '45 10 * * 1-5'
    # Yedek güvenlik ağı: Her 15 dakikada bir otomatik tetikleyici
    - cron: '*/15 7-15 * * 1-5'
  workflow_dispatch:

jobs:
  cloud_sync:
    runs-on: ubuntu-latest
    timeout-minutes: 270
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
        continue-on-error: true

      - name: Install Cloud Runner Dependencies
        run: |
          pip install --upgrade requests pandas yfinance
        continue-on-error: true

      - name: Run Cloud Market Sync Engine
        run: |
          echo "================================================="
          echo "  VARANTRADAR PRO - BIST CLOUD SYNC RUNNER"
          echo "  Baslangic: $(date -u)"
          echo "================================================="
          python scripts/cloud_market_sync.py || {
            echo "[FALLBACK] Python calismadi, bash curl dongusu baslatiliyor..."
            MAX_LOOPS=90
            LOOP_COUNT=0
            while [ $LOOP_COUNT -lt $MAX_LOOPS ]; do
              LOOP_COUNT=$((LOOP_COUNT+1))
              NOW_H=$(date -u +%-H)
              NOW_M=$(date -u +%-M)
              if [ $NOW_H -gt 15 ] || ([ $NOW_H -eq 15 ] && [ $NOW_M -ge 35 ]); then
                echo "Seans kapandi. Cikiliyor."
                break
              fi
              echo "[$(date -u +%T)] Verdent -> PA sync tetikleniyor..."
              curl -f -s -m 75 "https://varantradar-pro-8.verdent.app/api/cron/sync_to_pa" || true
              sleep 180
            done
          }
